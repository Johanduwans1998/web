{% extends "Layout.html" %}

{% block content %}
<link rel="stylesheet" href="../static/css/index.css">

<form action="/register_dia" method="post">
    <h2>Register</h2>
    <input type="text" name="nombre" id="nombre" value="{{session['nombre']}}" placeholder="Nombre">
    
    <div class="input-money">
        <span class="currency">$</span>
        <input type="number" name="reporte_dia" id="reporte_dia" placeholder="0.00" step="0.01" min="0">
    </div>

    <button type="submit">Register</button>
</form>

<table>
    <tr>
        <th>ID</th>
        <th>Reporte dia</th>
        <th>Fecha</th>
        <th>Nombre</th>
    </tr>
    {% if rows %}
        {% for row in rows %}
        <tr>
            <td>{{row[0]}}</td>
            <td>{{row[1]}}</td>
            <td>{{row[2]}}</td>
            <td>{{row[3]}}</td>
        </tr>
        {% endfor %}
    {% endif %}
</table>


{% endblock %}
